<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Productos | Phonekit.cba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <header class="site-header"></header>
    <main class="wrap">
        <section class="page-head">
            <div class="crumb">Inicio / <b>Productos</b></div>
            <h1>Productos</h1>
            <p>Explora nuestra colección de smartphones, accesorios y más. Encontrá tecnología al mejor precio.</p>
        </section>
        <div class="toolbar"><input class="search" id="search" placeholder="⌕  Buscar productos..."><select
                class="select" id="sort">
                <option value="">Ordenar por: Más vendidos</option>
                <option value="asc">Precio: menor a mayor</option>
                <option value="desc">Precio: mayor a menor</option>
            </select></div>
        <div class="chips" id="chips"><button class="chip active" data-category="">Todos</button><button class="chip"
                data-category="Celulares">Celulares</button><button class="chip"
                data-category="Fundas">Fundas</button><button class="chip"
                data-category="Smartwatch">Smartwatch</button><button class="chip"
                data-category="Tablets">Tablets</button><button class="chip"
                data-category="Auriculares">Auriculares</button><button class="chip"
                data-category="Accesorios">Accesorios</button></div>
        <section class="catalog">
            <aside class="filters">
                <h3>Filtros <a href="#" id="clear-filters" style="float:right;color:var(--cyan);font-size:10px">Limpiar todo</a></h3>
                <div class="filter-title">CATEGORÍA</div><label class="filter-item"><input type="checkbox" name="category" value="Fundas">
                    Fundas</label><label class="filter-item"><input type="checkbox" name="category" value="Celulares"> Celulares</label><label
                    class="filter-item"><input type="checkbox" name="category" value="Smartwatch"> Smartwatch</label><label class="filter-item"><input
                        type="checkbox" name="category" value="Tablets"> Tablets</label><label class="filter-item"><input type="checkbox" name="category" value="Auriculares">
                    Auriculares</label>
                <div class="filter-title">MARCA</div><label class="filter-item"><input type="checkbox" name="brand" value="Apple">
                    Apple</label><label class="filter-item"><input type="checkbox" name="brand" value="Samsung"> Samsung</label><label
                    class="filter-item"><input type="checkbox" name="brand" value="Motorola"> Motorola</label><label class="filter-item"><input
                        type="checkbox" name="brand" value="Xiaomi"> Xiaomi</label>
                <div class="filter-title">PRECIO</div>
                <div style="display:flex;gap:5px"><input class="input" id="price-min" placeholder="Min" style="padding:6px"><input
                        class="input" id="price-max" placeholder="Max" style="padding:6px"></div><button
                    class="button filter-button" id="apply-filters">Aplicar filtros</button>
            </aside>
            <div class="product-grid" id="catalog-grid"></div>
            <div class="pagination"><button>←</button><button
                    class="current">1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>→</button>
            </div>
        </section>
    </main><a class="floating-cart" href="carrito.html">🛒</a>
    <footer class="site-footer"></footer>
    <script src="../js/productos.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/carrito.js"></script>
    <script>
        let category = new URLSearchParams(location.search).get('categoria') || '';
        let selectedCategories = [];
        let selectedBrands = [];
        let minPrice = null;
        let maxPrice = null;

        const draw = () => {
            let q = document.querySelector('#search').value.toLowerCase();
            
            let filtered = products.filter(p => {
                // Filtro de búsqueda
                if (q && !p.name.toLowerCase().includes(q)) return false;
                
                // Filtro de categoría desde chips
                if (category && p.category !== category) return false;
                
                // Filtro de categorías desde checkboxes
                if (selectedCategories.length > 0 && !selectedCategories.includes(p.category)) return false;
                
                // Filtro de marcas
                if (selectedBrands.length > 0 && !selectedBrands.includes(p.brand)) return false;
                
                // Filtro de precio
                if (minPrice !== null && p.price < minPrice) return false;
                if (maxPrice !== null && p.price > maxPrice) return false;
                
                return true;
            });
            
            // Ordenamiento
            let s = document.querySelector('#sort').value;
            if (s) filtered.sort((x, y) => s === 'asc' ? x.price - y.price : y.price - x.price);
            
            document.querySelector('#catalog-grid').innerHTML = filtered.map(p => card(p, true)).join('');
        };
        
        // Evento de búsqueda
        document.querySelector('#search').oninput = draw;
        
        // Evento de ordenamiento
        document.querySelector('#sort').onchange = draw;
        
        // Chips de categoría
        document.querySelectorAll('[data-category]').forEach(b => b.onclick = (e) => {
            e.preventDefault();
            category = b.dataset.category;
            document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            draw();
        });
        
        // Botón Aplicar filtros
        document.querySelector('#apply-filters').onclick = (e) => {
            e.preventDefault();
            
            // Limpiar selecciones previas
            selectedCategories = [];
            selectedBrands = [];
            
            // Obtener categorías seleccionadas
            document.querySelectorAll('input[name="category"]:checked').forEach(cb => {
                selectedCategories.push(cb.value);
            });
            
            // Obtener marcas seleccionadas
            document.querySelectorAll('input[name="brand"]:checked').forEach(cb => {
                selectedBrands.push(cb.value);
            });
            
            // Obtener rango de precio
            const priceMinInput = document.querySelector('#price-min').value;
            const priceMaxInput = document.querySelector('#price-max').value;
            
            minPrice = priceMinInput ? parseFloat(priceMinInput) : null;
            maxPrice = priceMaxInput ? parseFloat(priceMaxInput) : null;
            
            draw();
        };
        
        // Limpiar todos los filtros
        document.querySelector('#clear-filters').onclick = (e) => {
            e.preventDefault();
            
            // Limpiar checkboxes
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            
            // Limpiar inputs de precio
            document.querySelector('#price-min').value = '';
            document.querySelector('#price-max').value = '';
            
            // Resetear variables
            category = '';
            selectedCategories = [];
            selectedBrands = [];
            minPrice = null;
            maxPrice = null;
            
            // Resetear chips
            document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('[data-category=""]')[0].classList.add('active');
            
            // Limpiar búsqueda
            document.querySelector('#search').value = '';
            
            draw();
        };
        
        draw();
    </script>
</body>

</html>
