<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos | Phonekit.cba</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="site-header"></header><main class="wrap"><section class="page-head"><div class="crumb">Inicio / <b>Productos</b></div><h1>Productos</h1><p>Explora nuestra colección de smartphones, accesorios y más. Encontrá tecnología al mejor precio.</p></section><div class="toolbar"><input class="search" id="search" placeholder="⌕  Buscar productos..."><select class="select" id="sort"><option value="">Ordenar por: Más vendidos</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option></select></div><div class="chips" id="chips"><button class="chip active" data-category="">Todos</button><button class="chip" data-category="Celulares">Celulares</button><button class="chip" data-category="Fundas">Fundas</button><button class="chip" data-category="Smartwatch">Smartwatch</button><button class="chip" data-category="Tablets">Tablets</button><button class="chip" data-category="Auriculares">Auriculares</button><button class="chip" data-category="Accesorios">Accesorios</button></div><section class="catalog"><aside class="filters"><h3>Filtros <a href="#" style="float:right;color:var(--cyan);font-size:10px">Limpiar todo</a></h3><div class="filter-title">CATEGORÍA</div><label class="filter-item"><input type="checkbox"> Fundas</label><label class="filter-item"><input type="checkbox"> Celulares</label><label class="filter-item"><input type="checkbox"> Smartwatch</label><label class="filter-item"><input type="checkbox"> Tablets</label><label class="filter-item"><input type="checkbox"> Auriculares</label><div class="filter-title">MARCA</div><label class="filter-item"><input type="checkbox"> Apple</label><label class="filter-item"><input type="checkbox"> Samsung</label><label class="filter-item"><input type="checkbox"> Motorola</label><label class="filter-item"><input type="checkbox"> Xiaomi</label><div class="filter-title">PRECIO</div><div style="display:flex;gap:5px"><input class="input" placeholder="Min" style="padding:6px"><input class="input" placeholder="Max" style="padding:6px"></div><button class="button filter-button">Aplicar filtros</button></aside><div class="product-grid" id="catalog-grid"></div><div class="pagination"><button>←</button><button class="current">1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>→</button></div></section></main><a class="floating-cart" href="carrito.html">🛒</a><footer class="site-footer"></footer><script src="../js/productos.js"></script><script src="../js/navbar.js"></script><script src="../js/carrito.js"></script><script>let category=new URLSearchParams(location.search).get('categoria')||'';const draw=()=>{let q=document.querySelector('#search').value.toLowerCase(),a=products.filter(p=>(!category||p.category===category)&&p.name.toLowerCase().includes(q));let s=document.querySelector('#sort').value;if(s)a.sort((x,y)=>s==='asc'?x.price-y.price:y.price-x.price);document.querySelector('#catalog-grid').innerHTML=a.map(p=>card(p,true)).join('')};document.querySelector('#search').oninput=draw;document.querySelector('#sort').onchange=draw;document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()});draw()</script></body></html>
